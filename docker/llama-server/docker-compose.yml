services:
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llama-server
    restart: unless-stopped
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "${PORT:-30000}:${PORT:-30000}"
    volumes:
      - ./models:/models:ro
      - ./templates:/templates:ro
    command: >
      -m /models/${MODEL_FILE}
      ${MMPROJ_FILE:+--mmproj /models/$MMPROJ_FILE}
      --host 0.0.0.0
      --port ${PORT:-30000}
      -ngl ${N_GPU_LAYERS:-99}
      -c ${CTX_SIZE:-8192}
      -np ${PARALLEL_SLOTS:-1}
      -fa ${FLASH_ATTENTION:-on}
      --jinja
      ${CHAT_TEMPLATE_FILE:+--chat-template-file /templates/$CHAT_TEMPLATE_FILE}

